services:
  - type: worker
    name: mostaql-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MOSTAQL_EMAIL
        sync: false
      - key: MOSTAQL_PASSWORD
        sync: false
